name: Gallery image

on:
  schedule:
    # Weekly rebuild. The deployed gallery has no restart hook, so the cluster picks
    # this image up whenever the pod next restarts -- see
    # docs/adr/0003-scheduled-rebuild-without-restart-hook.md.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "openms_insight/**"
      - "js-component/**"
      - "pyproject.toml"
      - ".github/workflows/gallery-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openms-insight-gallery

jobs:
  verify:
    # The image is built from fully pinned dependencies, so this suite is a
    # reproducibility check rather than a drift detector. Drift is surfaced instead by
    # Dependabot pull requests, where these same tests run against the new versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: js-component/package-lock.json

      - name: Build Vue component
        working-directory: js-component
        run: |
          npm ci
          npm run build

      - name: Copy dist into package
        run: |
          mkdir -p openms_insight/js-component
          cp -r js-component/dist openms_insight/js-component/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gallery/requirements.txt
          pip install -e ".[dev]"

      - name: Run the example suite
        run: pytest tests/test_gallery_coverage.py tests/test_gallery_nav.py tests/test_gallery_pages.py -v --no-cov

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gallery/Dockerfile
          push: true
          # A mutable 'main' tag is what makes a pod restart pick up the newest build;
          # the SHA tag exists so a deployment can be pinned or rolled back.
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          docker run -d --name gallery -p 8501:8501 ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Gallery healthy after ${i}s"
              docker rm -f gallery
              exit 0
            fi
            sleep 1
          done
          echo "Gallery did not become healthy"
          docker logs gallery
          docker rm -f gallery
          exit 1
